<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' https://appsforoffice.microsoft.com https://ajax.aspnetcdn.com; style-src 'self'; connect-src 'self' https://www.google.com https://www.googleapis.com https://speech.googleapis.com; img-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
  />
  <meta http-equiv="Referrer-Policy" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bot Mail IA</title>
  <link rel="stylesheet" href="./taskpane.css" />
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body>
  <header class="top">
    <div>
      <h1>Bot Mail IA</h1>
      <p class="lede">Lis le mail, dis ce que tu veux, insère la réponse.</p>
    </div>
    <p id="status" class="status" role="status">Ouverture du complément…</p>
  </header>

  <main>
    <section class="card">
      <div class="card-head">
        <h2>Mail</h2>
        <button id="readMailBtn" class="ghost" type="button">Lire le mail</button>
      </div>
      <textarea
        id="emailText"
        placeholder="Le mail ouvert apparaîtra ici."
      ></textarea>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Intention</h2>
        <div class="pills" id="languagePills" role="group" aria-label="Langue">
          <button type="button" data-lang="auto" class="active">Auto</button>
          <button type="button" data-lang="fr">FR</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>
      <textarea
        id="intentionText"
        placeholder="Ex. : Dis-lui que j’ai bien reçu et que je reviens demain."
      ></textarea>
      <div class="toolbar">
        <div class="pills" id="privacyPills" role="group" aria-label="Confidentialité">
          <button type="button" data-privacy="confidential" class="active">Confidentiel</button>
          <button type="button" data-privacy="normal">Plus précis</button>
        </div>
        <p class="hint" id="privacyHint">Le contenu du mail n’est pas envoyé à l’IA.</p>
      </div>
      <div class="actions">
        <button id="voiceBtn" class="secondary" type="button">Dicter</button>
        <button id="generateBtn" type="button">Générer</button>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Réponse</h2>
        <button id="clearBtn" class="ghost" type="button">Effacer</button>
      </div>
      <textarea
        id="replyText"
        placeholder="La réponse proposée s’affichera ici."
      ></textarea>
      <div class="actions">
        <button id="insertBtn" type="button">Insérer dans Outlook</button>
      </div>
    </section>
  </main>

  <script src="./taskpane.js"></script>
</body>
</html>
